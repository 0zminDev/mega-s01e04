name: Publish digest preview

on:
  workflow_dispatch:
    inputs:
      lane_marker:
        description: Optional lane marker shown in the preview
        required: false
        type: string
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      LANE_MARKER: ${{ inputs.lane_marker }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm typecheck
      - uses: actions/configure-pages@v5
      - name: Render digest HTML
        run: |
          mkdir -p "$RUNNER_TEMP/digest-preview"
          pnpm --silent export:digest > "$RUNNER_TEMP/digest-preview/index.html"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/digest-preview
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
